<!-- Fonts are served from this site (no extra domains to look up on a slow connection) and cached for offline play.
     Deliberately not preloaded: on a thin connection the game script gets the bandwidth first, and the
     canvas swaps the fonts in the moment they arrive. -->
<style>
  @font-face { font-family: 'Luckiest Guy'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/luckiest-guy-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Luckiest Guy'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/luckiest-guy-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 700 900; font-display: swap; src: url(fonts/nunito-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 700 900; font-display: swap; src: url(fonts/nunito-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #07091a; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* sized in JS to the *visible* viewport: 100vh on mobile Safari includes the area hidden behind the toolbar */
  canvas { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; outline: none; }
  /* loading screen: plain HTML so it shows the moment the page arrives, before the game script */
  #boot { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #07091a; color: #fff; font: 700 16px system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; transition: opacity .35s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font: 900 clamp(30px, 7vw, 56px) Impact, 'Arial Black', system-ui, sans-serif; color: #ffe066; letter-spacing: 1px; text-shadow: 3px 3px 0 #000; }
  #boot .ball { font-size: 48px; line-height: 1; animation: hop .7s ease-in-out infinite alternate; }
  @keyframes hop { from { transform: translateY(0) rotate(0); } to { transform: translateY(-22px) rotate(180deg); } }
  #boot .bar { width: min(280px, 70vw); height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #1b8a3c; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #boot .msg { color: rgba(255,255,255,.75); max-width: 420px; font-size: 14px; }
  #boot .msg b { color: #ffe066; }
  #boot button { font: 700 16px system-ui, sans-serif; padding: 10px 20px; border-radius: 12px; border: 0; background: #2b8a3e; color: #fff; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { #boot .ball, #boot .bar i { animation: none; } }
</style>
<script>
  // Loading screen + offline support. Kept tiny and inline so it works before anything else arrives.
  var Boot = (function () {
    var t0 = Date.now(), slowTimer, el = function (id) { return document.getElementById(id); };
    function msg(html) { var m = el('boot-msg'); if (m) m.innerHTML = html; }
    var B = {
      ready: function () {
        clearTimeout(slowTimer);
        var b = el('boot'); if (!b) return;
        b.className = 'gone'; setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 400);
      },
      fail: function () {
        clearTimeout(slowTimer);
        var bar = document.querySelector('#boot .bar'); if (bar) bar.style.display = 'none';
        msg('Could not download the game.' + (navigator.onLine === false ? ' You are offline.' : ' The connection dropped.') +
          '<br><br><button onclick="location.reload()">Try again</button>');
      },
    };
    // a game script that fails to download (connection dropped mid-way) -> say so and offer a retry
    window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') B.fail(); }, true);
    slowTimer = setTimeout(function () {
      msg('Slow connection? Hang on, it is <b>under 200 KB</b> and only downloads once.<br>After this the game <b>plays offline</b>.');
    }, 4000);
    // Store the game on this device (needs https or localhost). ?nosw=1 skips it.
    if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href) && !/[?&]nosw/.test(location.search)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // check for a new version now and then, but only when there is a connection to check with
          setInterval(function () { if (navigator.onLine !== false) reg.update().catch(function () {}); }, 30 * 60 * 1000);
        }).catch(function () { /* private mode, old browser: the game still works, just not offline */ });
        var had = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (typeof App === 'undefined' || !App.toast) return;
          if (!had) App.toast('✅ Saved on this device: the game now plays offline', '#7CFC00');
          else App.toast('⬆️ Update downloaded: it starts next time you open the game', '#9cf');
          had = true;
        });
      });
    }
    window.addEventListener('offline', function () { if (typeof App !== 'undefined' && App.toast) App.toast('📴 Offline? No problem: the game runs on your device', '#ffd43b'); });
    return B;
  })();
</script>
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="ball">⚽</div>
  <h1>MONATE CUP</h1>
  <div class="bar"><i></i></div>
  <div class="msg" id="boot-msg">Loading…</div>
  <noscript><p>This game needs JavaScript turned on.</p></noscript>
</div>
<canvas id="game" tabindex="0"></canvas>
